<!DOCTYPE html>
<!--
  EthNow status page.

  Embedded verbatim into the firmware (EMBED_TXTFILES in src/CMakeLists.txt)
  and served from flash, so it must stay self-contained: no CDN, no fonts, no
  external anything. Live data arrives on /ws as one JSON object per frame:

    {"t":"s", ...}   status snapshot, sent on connect and whenever it changes
    {"t":"m", ...}   one received ESP-NOW frame
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EthNow</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel-2: #fafbfc;
  --line: #e3e6ea;
  --ink: #14181d;
  --ink-dim: #626d7a;
  --accent: #2f6df6;
  --ok: #12894c;
  --ok-bg: #dcf5e7;
  --bad: #cf2d3c;
  --bad-bg: #fde3e5;
  --warn: #96650a;
  --warn-bg: #fbeecd;
  --sel: #dbe6ff;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .05);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1b212a;
    --line: #262d38;
    --ink: #e6edf3;
    --ink-dim: #8b97a6;
    --accent: #5b8cff;
    --ok: #4ddb92;
    --ok-bg: #10331f;
    --bad: #ff7b86;
    --bad-bg: #3a1418;
    --warn: #f3c04e;
    --warn-bg: #3a2c0c;
    --sel: #1e2f52;
    --shadow: none;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 20px 48px;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

main { max-width: 1080px; margin: 0 auto; }

/* ---- header ---- */
header {
  display: flex;
  flex-wrap: wrap;
  /* Not baseline: the badge is a padded pill, so aligning its text baseline
   * with the title's leaves the pill itself hanging below the wordmark. */
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 650;
  letter-spacing: -.02em;
}
h1 .host { color: var(--accent); }
header .spacer { flex: 1 1 auto; }
header .build { color: var(--ink-dim); font-size: 13px; font-variant-numeric: tabular-nums; }
header a { color: var(--accent); text-decoration: none; font-size: 13.5px; font-weight: 600; }
header a:hover { text-decoration: underline; }

#link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--bad-bg);
  color: var(--bad);
}
#link::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: currentColor;
}
#link.up { background: var(--ok-bg); color: var(--ok); }

/* ---- stat cards ---- */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 15px 14px;
  box-shadow: var(--shadow);
}
.card .k {
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.card .v {
  margin-top: 5px;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.card .v small {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-dim);
  margin-left: 5px;
}
.card .sub { margin-top: 3px; font-size: 12.5px; color: var(--ink-dim); }
.card .sub .on { color: var(--ok); font-weight: 650; }

.pill {
  display: inline-block;
  padding: 2px 10px 3px;
  border-radius: 7px;
  font-size: 15px;
  font-weight: 650;
}
.pill.ok   { background: var(--ok-bg);   color: var(--ok); }
.pill.bad  { background: var(--bad-bg);  color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.off  { background: var(--panel-2); color: var(--ink-dim); }

/* ---- table ---- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
}
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
.panel-head .hint { margin-left: auto; font-size: 12.5px; color: var(--ink-dim); }
kbd {
  font: 600 11px/1.4 var(--mono);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 5px;
  background: var(--panel-2);
}

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky;
  top: 0;
  background: var(--panel-2);
  text-align: left;
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-dim);
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody td {
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
  /* Baseline, not top: top aligns each cell's line box, so any difference in
   * font metrics between the columns shows up as text sitting a pixel or two
   * low. Baseline lines the glyphs themselves up, and on a payload that wraps
   * it is the first line every other column aligns to -- which is what the
   * eye expects anyway. */
  vertical-align: baseline;
  line-height: 20px;
}
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel-2); }
tbody tr[aria-selected="true"] td {
  background: var(--sel);
  box-shadow: inset 3px 0 0 var(--accent);
}
tbody tr.fresh td { animation: flash 1.1s ease-out; }
@keyframes flash { from { background: var(--sel); } }
@media (prefers-reduced-motion: reduce) { tbody tr.fresh td { animation: none; } }

/* All four columns are machine data, so all four are monospaced at one size --
 * the RSSI reading has no more reason to be set in the UI font than the MAC
 * does, and matching metrics keep the row visually level. */
td.ts, td.mac, td.rssi, td.pl { font-family: var(--mono); font-size: 13px; }
td.ts  { color: var(--ink-dim); white-space: nowrap; }
td.mac { white-space: nowrap; }
td.rssi { white-space: nowrap; font-weight: 600; }
td.rssi.s-ok   { color: var(--ok); }
td.rssi.s-warn { color: var(--warn); }
td.rssi.s-bad  { color: var(--bad); }
td.pl { width: 100%; overflow-wrap: anywhere; }

tbody tr.pinned td { border-top: 1px dashed var(--line); }
tbody tr.pinned td.ts::after {
  content: "pinned";
  display: block;
  font: 650 10px/1.4 system-ui, sans-serif;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--accent);
}
.empty { padding: 28px 16px; text-align: center; color: var(--ink-dim); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Eth<span class="host">Now</span></h1>
    <span id="link">connecting</span>
    <span class="spacer"></span>
    <span class="build" id="build"></span>
    <a href="/info">device info &rarr;</a>
  </header>

  <section class="stats">
    <div class="card">
      <div class="k">Hostname</div>
      <div class="v" id="host">&mdash;</div>
    </div>
    <div class="card">
      <div class="k">IP address</div>
      <div class="v" id="ip">&mdash;</div>
      <div class="sub" id="ipsub">&nbsp;</div>
    </div>
    <div class="card">
      <div class="k">MQTT</div>
      <div class="v"><span class="pill off" id="mqtt">unknown</span></div>
      <div class="sub" id="broker">&nbsp;</div>
    </div>
    <div class="card">
      <div class="k">ESP-NOW packets</div>
      <div class="v" id="rx">&mdash;</div>
      <div class="sub" id="drop">&nbsp;</div>
    </div>
    <div class="card">
      <div class="k">Channel</div>
      <div class="v" id="ch">&mdash;</div>
      <div class="sub" id="lrsub">&nbsp;</div>
    </div>
    <div class="card">
      <div class="k">Uptime</div>
      <div class="v" id="up">&mdash;</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Recent frames</h2>
      <span class="hint">click a row to keep it &middot; <kbd>Esc</kbd> to clear</span>
    </div>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Sender MAC</th>
            <th>RSSI</th>
            <th>Payload</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty">No frames received yet.</div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

/* rows[0] is the newest. `cap` mirrors CONFIG_WEB_HISTORY, which the server
 * reports in every status frame -- the server's ring is the source of truth
 * for how many frames exist, and the client never keeps more than that.
 *
 * The one exception is `pinned`: a selected row that has since aged out of the
 * server's ring. It is held client-side only and rendered last, so the user's
 * selection sinks to the bottom of the list instead of vanishing. */
const state = { rows: [], cap: 10, sel: null, pinned: null };

const pad = (n, w = 2) => String(n).padStart(w, "0");

/* Milliseconds since boot as h:mm:ss.mmm -- the device has no wall clock. */
function fmtStamp(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}.${pad(ms % 1000, 3)}`;
}

function fmtUptime(ms) {
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const hms = `${pad(Math.floor(s / 3600) % 24)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  return d ? `${d}d ${hms}` : hms;
}

const rssiClass = (dbm) => (dbm >= -65 ? "s-ok" : dbm >= -80 ? "s-warn" : "s-bad");

function setPill(el, on, onText, offText) {
  el.textContent = on ? onText : offText;
  el.className = `pill ${on ? "ok" : "bad"}`;
}

/* ---------------------------------------------------------------- status */

function applyStatus(s) {
  state.cap = s.hist;
  document.title = `${s.host} — EthNow`;
  $("host").textContent = s.host;

  $("ip").textContent = s.ip;
  $("ipsub").textContent = s.dhcp ? "DHCP" : "static";

  setPill($("mqtt"), s.mqtt, "connected", "disconnected");
  $("broker").textContent = s.broker;

  $("rx").innerHTML = `${s.rx.toLocaleString()}<small>frames</small>`;
  $("drop").textContent = s.drop ? `${s.drop} dropped` : "none dropped";
  $("drop").style.color = s.drop ? "var(--bad)" : "";

  /* Long range has no card of its own -- it is a property of how the radio is
   * listening, so it reads as part of the channel. */
  $("ch").textContent = s.ch;
  $("lrsub").replaceChildren("802.11b/g/n");
  if (s.lr) {
    const lr = document.createElement("span");
    lr.className = "on";
    lr.textContent = " + LR";
    $("lrsub").append(lr);
  }

  $("up").textContent = fmtUptime(s.up);
  $("build").textContent = `${s.ver} · ${s.slot}`;
}

/* ----------------------------------------------------------------- table */

function addMsg(m) {
  if (state.rows.some((r) => r.seq === m.seq)) return;   /* replayed on reconnect */
  if (state.pinned?.seq === m.seq) state.pinned = null;

  state.rows.unshift(m);
  while (state.rows.length > state.cap) {
    const gone = state.rows.pop();
    /* The selection outlives the server's ring, for this browser only. */
    if (gone.seq === state.sel) state.pinned = gone;
  }
}

function select(seq) {
  state.sel = seq;
  if (state.pinned && state.pinned.seq !== seq) state.pinned = null;
  render();
}

function clearSelection() {
  if (state.sel === null && !state.pinned) return;
  state.sel = null;
  state.pinned = null;
  render();
}

function rowEl(m, pinned) {
  const tr = document.createElement("tr");
  tr.dataset.seq = m.seq;
  if (pinned) tr.className = "pinned";
  if (m.seq === state.sel) tr.setAttribute("aria-selected", "true");
  else if (m.fresh) tr.classList.add("fresh");

  const cell = (cls, text, title) => {
    const td = document.createElement("td");
    td.className = cls;
    td.textContent = text;
    if (title) td.title = title;
    tr.appendChild(td);
  };

  cell("ts", fmtStamp(m.ms), `${m.ms} ms since boot`);
  cell("mac", m.mac);

  const td = document.createElement("td");
  td.className = `rssi ${rssiClass(m.rssi)}`;
  td.textContent = `${m.rssi} dBm`;
  tr.appendChild(td);

  cell("pl", m.pl, `${m.len} bytes`);
  return tr;
}

function render() {
  const shown = [...state.rows];
  if (state.pinned) shown.push(state.pinned);

  $("rows").replaceChildren(...shown.map((m) => rowEl(m, m === state.pinned)));
  $("empty").hidden = shown.length > 0;
  for (const m of state.rows) m.fresh = false;
}

$("rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr");
  if (tr) select(Number(tr.dataset.seq));
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") clearSelection();
});

/* ------------------------------------------------------------- transport */

/* Three missed status frames. Long enough that a busy device or a stalled
 * send is not mistaken for a dead one, short enough to notice a reboot. */
const STALE_MS = 3500;

let sock = null;
let seenAt = 0;                         /* last byte from the device */
let backoff = 0;

function setLink(text, up) {
  $("link").textContent = text;
  $("link").className = up ? "up" : "";
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  sock = ws;
  seenAt = Date.now();

  ws.onopen = () => {
    backoff = 0;
    seenAt = Date.now();
    setLink("live", true);
    /* The server replays its whole ring on connect; start from empty so a
     * reconnect cannot leave a stale gap in the middle of the list. */
    state.rows = [];
  };

  ws.onmessage = (e) => {
    seenAt = Date.now();
    const d = JSON.parse(e.data);
    if (d.t === "s") applyStatus(d);
    else if (d.t === "m") { d.fresh = true; addMsg(d); }
    render();
  };

  ws.onerror = () => ws.close();

  ws.onclose = () => {
    if (sock !== ws) return;            /* superseded by a later attempt */
    sock = null;
    setLink("offline", false);
    setTimeout(connect, Math.min(500 * 2 ** backoff++, 5000));
  };
}

/*
 * Heartbeat watchdog.
 *
 * A device that reboots -- after an OTA, most of the time -- never gets to
 * send a FIN, so the browser is left holding a half-open socket: onclose does
 * not fire until TCP gives up minutes later, and until then the page happily
 * claims to be live. The server's once-a-second status frame is the only
 * timely evidence the far end is still there, so silence is what we act on.
 */
setInterval(() => {
  if (sock?.readyState === WebSocket.OPEN && Date.now() - seenAt > STALE_MS) {
    setLink("offline", false);
    sock.close();                       /* drives the reconnect through onclose */
  }
}, 1000);

connect();
</script>
</body>
</html>

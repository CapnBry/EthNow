; EthNow -- ESP-NOW to MQTT bridge for the ESP32-C3 ETH01-EVO
;
; Two environments:
;   ota  (default) - update over the ethernet link, no UART needed
;   uart           - initial flashing / recovery over UART0 at 2 Mbaud
;
;   pio run -e uart -t upload      <- first flash
;   pio run -t upload              <- every flash after that

[platformio]
default_envs = ota
src_dir = src

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf

; Pin the IDF so a platform update cannot silently move it. The package is
; published as a release tarball rather than through the PlatformIO registry,
; so it has to be pinned by URL -- a bare version number will not resolve.
platform_packages =
    framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v5.5.4/esp-idf-v5.5.4.tar.xz

board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB

monitor_speed = 115200
monitor_filters = direct, esp_idf_exception_decoder

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; ---------------------------------------------------------------------------
; OTA over ethernet. The device serves an unauthenticated POST endpoint at
; /update; curl streams the image straight into the inactive OTA slot.
;
; Set custom_ota_host to the device IP or <hostname>.local. It is deliberately
; not `upload_port` -- the platform rewrites upload_protocol to espota (the
; Arduino OTA protocol, which an ESP-IDF app does not speak) as soon as
; upload_port looks like a host name.
; ---------------------------------------------------------------------------
[env:ota]
upload_protocol = custom
custom_ota_host = ethnow.local
; -H "Expect:" is required: curl adds "Expect: 100-continue" for bodies over
; 1 KB, and esp_http_server never sends the 100 interim response, so the
; transfer sits idle until curl gives up waiting.
; --max-time covers the whole transfer, not just the connect, so it must be
; generous -- SPI ethernet plus flash writes is not fast.
upload_command = curl -sS --fail -H "Expect:" --connect-timeout 5 --max-time 600 --progress-bar -X POST --data-binary @$SOURCE http://${this.custom_ota_host}/update

; ---------------------------------------------------------------------------
; Initial flash over UART0 (GPIO19 TX / GPIO20 RX).
; 2 Mbaud is the fastest rate that is reliably achievable on the C3's
; USB-serial bridge; drop to 921600 if the bridge on your cable chokes.
; ---------------------------------------------------------------------------
[env:uart]
upload_protocol = esptool
upload_speed = 2000000
; upload_port = /dev/ttyUSB0
